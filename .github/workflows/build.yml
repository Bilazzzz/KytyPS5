name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            qt6-base-dev \
            libvulkan-dev \
            libsdl2-dev \
            glslang-dev \
            spirv-tools \
            libfmt-dev \
            libxxhash-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            vulkan-tools

      - name: Configure
        run: |
          cmake -S . \
            -B _Build/linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build _Build/linux --parallel

      - name: Run tests
        run: |
          ctest --test-dir _Build/linux --output-on-failure || true

      - name: Install
        run: |
          cmake --install _Build/linux --prefix _Build/linux/install

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="KytyPS5-${VERSION}-Linux-x86_64"
          mkdir -p "${PKG_NAME}"
          cp -r _Build/linux/install/* "${PKG_NAME}/"
          cp README.md "${PKG_NAME}/"
          cp CHANGELOG.md "${PKG_NAME}/"
          tar -cJf "${PKG_NAME}.tar.xz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.xz" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KytyPS5-*.tar.xz
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
